name: Photos candidates
on:
  push:
    branches: [photos]
    paths: ['tools/photos/**', '.github/workflows/photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/photos/chercher.py
      - run: |
          git config user.name "AG 2027 photos"; git config user.email "actions@users.noreply.github.com"
          git add candidats && git commit -m "Photos candidates" && git push
