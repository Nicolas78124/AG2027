# Garde le projet Supabase actif (l'offre gratuite se met en pause après 7 jours sans activité).
# Simple LECTURE (GET) d'une ligne : ne modifie ni le site ni les données.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"   # tous les 3 jours, vers 10 h 17 (heure de Paris)
  workflow_dispatch: {}       # lancement manuel possible depuis l'onglet Actions

permissions: {}               # aucun droit sur le dépôt

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lecture Supabase (GET, lecture seule)
        env:
          SB_URL: https://hhjhyhcpqebwfqaxunva.supabase.co
          SB_KEY: sb_publishable_T3zdYlGEBtNHD0fJTYCQXg_TsahGWM0   # clé publique, déjà présente dans index.html
        run: |
          code=$(curl -sS -o /tmp/r.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SB_KEY" \
            "$SB_URL/rest/v1/expenses?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then cat /tmp/r.txt; exit 1; fi
          echo "Supabase répond : projet actif."
