<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EVA BP Days</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#0A1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AG 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1630;--card:#12224A;--card2:#1A2C58;--gold:#D4AF5A;--gold2:#E9C977;
  --ink:#F5EEDC;--mute:#9FAAC4;--line:rgba(212,175,90,.3);
  --serif:'Cormorant Garamond',Georgia,serif;--script:'Great Vibes',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;padding:20px 20px 6px}
.head img{width:52px;height:52px;display:block}
.kicker{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:600}
h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05}
h2.script{margin:0;font-family:var(--script);font-weight:400;font-size:34px;color:var(--gold2)}
.sec{margin:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.card{padding:22px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.card img{width:min(180px,50vw);height:auto}
.small{font-size:13px;color:var(--mute);line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <img src="logo-sm.png" alt="">
    <div>
      <div class="kicker">AG 2027</div>
      <h1>Espace</h1>
    </div>
  </header>

  <section class="sec">
    <h2 class="script">Bientôt ici</h2>
    <div class="card">
      <img src="logo.png" alt="Logo AG 2027">
      <span class="small">Cette page est en préparation.</span>
    </div>
  </section>
</div>
</body>
</html>
