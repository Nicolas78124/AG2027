<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7FD0"/>
      <stop offset=".55" stop-color="#6FB6EC"/>
      <stop offset="1" stop-color="#CFEAF7"/>
    </linearGradient>
    <linearGradient id="large" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D4F8F"/>
      <stop offset="1" stop-color="#1673A8"/>
    </linearGradient>
    <linearGradient id="lagon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA7B8"/>
      <stop offset=".45" stop-color="#3FD0CB"/>
      <stop offset="1" stop-color="#9FEDE0"/>
    </linearGradient>
    <linearGradient id="sable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF2DC"/>
      <stop offset="1" stop-color="#EAD6AE"/>
    </linearGradient>
    <linearGradient id="morne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6A5C"/>
      <stop offset="1" stop-color="#4E8C7C"/>
    </linearGradient>
    <radialGradient id="soleil" cx=".78" cy=".14" r=".35">
      <stop offset="0" stop-color="#FFF8DC" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#FFF3C4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tronc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4A2B"/>
      <stop offset="1" stop-color="#9A7149"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1630" stop-opacity=".72"/>
      <stop offset=".3" stop-color="#0A1630" stop-opacity=".22"/>
      <stop offset=".75" stop-color="#0A1630" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0A1630" stop-opacity=".45"/>
    </linearGradient>
    <g id="palme">
      <path d="M0 0 C 30 -18, 70 -16, 104 6 C 70 -4, 34 -2, 0 0 Z"/>
      <path d="M14 -3 l6 12 M28 -6 l7 13 M42 -8 l8 13 M56 -8 l8 12 M70 -6 l8 11 M84 -2 l7 9" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ciel -->
  <rect width="390" height="844" fill="url(#ciel)"/>
  <rect width="390" height="844" fill="url(#soleil)"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="300" cy="150" rx="46" ry="11"/><ellipse cx="330" cy="142" rx="30" ry="12"/>
    <ellipse cx="150" cy="300" rx="54" ry="10" opacity=".6"/><ellipse cx="180" cy="292" rx="28" ry="10" opacity=".6"/>
    <ellipse cx="60" cy="250" rx="34" ry="7" opacity=".7"/>
  </g>

  <!-- Morne Brabant à l'horizon -->
  <path d="M-10 352 L 0 340 C 14 332, 26 322, 36 304 C 44 290, 50 276, 62 270 L 96 266 C 108 266, 116 270, 120 280 L 126 300 C 132 314, 150 326, 176 336 C 200 344, 220 348, 240 352 Z" fill="url(#morne)"/>
  <path d="M62 270 L 96 266 C 108 266, 116 270, 120 280 L 126 300 C 112 292, 92 290, 74 296 Z" fill="#24584B" opacity=".55"/>
  <path d="M-10 352 C 40 344, 90 346, 140 350 L 140 352 Z" fill="#3F7E6E"/>
  <!-- océan au large -->
  <rect y="350" width="390" height="70" fill="url(#large)"/>
  <!-- barrière de corail -->
  <path d="M0 414 C 60 408, 120 418, 190 410 S 320 406, 390 412 L 390 424 C 320 420, 250 426, 190 422 S 70 422, 0 426 Z" fill="#fff" opacity=".9"/>
  <path d="M0 422 C 80 418, 150 428, 230 420 S 350 418, 390 422" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>
  <!-- lagon turquoise -->
  <path d="M0 424 C 80 420, 160 428, 240 422 S 360 420, 390 424 L 390 640 L 0 640 Z" fill="url(#lagon)"/>
  <g stroke="#fff" stroke-linecap="round" fill="none" opacity=".35">
    <path d="M30 470 h40 M120 455 h30 M250 480 h50 M60 530 h55 M190 510 h40 M300 545 h45 M110 590 h60" stroke-width="2"/>
  </g>
  <!-- pirogue -->
  <g transform="translate(220 492)">
    <path d="M0 0 C 14 7, 40 7, 54 0 L 48 6 C 36 10, 18 10, 6 6 Z" fill="#B83A48"/>
    <path d="M26 -1 L 26 -34" stroke="#5B3C22" stroke-width="2"/>
    <path d="M27 -33 C 40 -24, 44 -12, 46 -3 L 27 -3 Z" fill="#FBF2DC"/>
  </g>

  <!-- plage -->
  <path d="M0 600 C 90 586, 170 604, 260 592 C 320 584, 360 590, 390 596 L 390 844 L 0 844 Z" fill="url(#sable)"/>
  <path d="M0 600 C 90 586, 170 604, 260 592 C 320 584, 360 590, 390 596" stroke="#fff" stroke-width="5" fill="none" opacity=".85"/>
  <path d="M0 612 C 90 598, 170 614, 260 604 C 320 598, 360 602, 390 608" stroke="#BDE9E2" stroke-width="3" fill="none" opacity=".6"/>
  <!-- ombres des palmiers sur le sable -->
  <ellipse cx="300" cy="790" rx="110" ry="16" fill="#C9B184" opacity=".5"/>
  <ellipse cx="60" cy="720" rx="70" ry="10" fill="#C9B184" opacity=".45"/>

  <!-- cocotier de droite -->
  <path d="M352 844 C 350 760, 330 660, 280 560 C 274 548, 284 544, 290 556 C 340 652, 366 760, 372 844 Z" fill="url(#tronc)"/>
  <g stroke="#5A3E25" stroke-width="1.4" opacity=".55">
    <path d="M354 820 l14 -2 M350 780 l14 -3 M344 740 l14 -4 M336 700 l13 -4 M326 660 l12 -5 M314 620 l11 -5 M302 588 l10 -5"/>
  </g>
  <g transform="translate(284 552)" fill="#2F7D3B" stroke="#2F7D3B">
    <use href="#palme" transform="rotate(-160) scale(1.15)"/>
    <use href="#palme" transform="rotate(-125) scale(1.05)"/>
    <use href="#palme" transform="rotate(-80) scale(.95)"/>
    <use href="#palme" transform="rotate(-35) scale(1.1)"/>
    <use href="#palme" transform="rotate(5) scale(1.05)"/>
    <use href="#palme" transform="rotate(40) scale(1)"/>
    <use href="#palme" transform="rotate(150) scale(1.05)"/>
  </g>
  <g transform="translate(284 552)" fill="#3E9A48" stroke="#3E9A48" opacity=".9">
    <use href="#palme" transform="rotate(-145) scale(.9)"/>
    <use href="#palme" transform="rotate(-55) scale(.85)"/>
    <use href="#palme" transform="rotate(20) scale(.85)"/>
  </g>
  <circle cx="280" cy="558" r="5" fill="#6B4A2B"/><circle cx="290" cy="560" r="5" fill="#5A3E25"/><circle cx="285" cy="566" r="4.5" fill="#6B4A2B"/>

  <!-- petit cocotier de gauche -->
  <path d="M30 760 C 34 700, 50 650, 78 610 C 82 604, 88 608, 84 614 C 60 656, 46 704, 42 760 Z" fill="url(#tronc)"/>
  <g transform="translate(80 610)" fill="#2F7D3B" stroke="#2F7D3B">
    <use href="#palme" transform="rotate(-170) scale(.75)"/>
    <use href="#palme" transform="rotate(-120) scale(.7)"/>
    <use href="#palme" transform="rotate(-60) scale(.65)"/>
    <use href="#palme" transform="rotate(-15) scale(.75)"/>
    <use href="#palme" transform="rotate(25) scale(.7)"/>
    <use href="#palme" transform="rotate(160) scale(.7)"/>
  </g>

  <!-- voile sombre pour garder le texte lisible -->
  <rect width="390" height="844" fill="url(#voile)"/>
</svg>
