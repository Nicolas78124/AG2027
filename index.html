<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AG 2027</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AG 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1630;--card:#12224A;--card2:#1A2C58;--chip:#1B2F5E;--nav:#081126;
  --gold:#D4AF5A;--gold2:#E9C977;--ink:#F5EEDC;--mute:#9FAAC4;--soft:#C9D0E0;
  --line:rgba(212,175,90,.3);--blue:#1F3E7A;--red:#6E2430;--pos:#8FD3A8;--neg:#F2A3AC;
  --serif:'Cormorant Garamond',Georgia,serif;--script:'Great Vibes',cursive;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--gold2);text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:12px;padding:20px 20px 6px}
.head img{width:52px;height:52px;display:block}
.kicker{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:600}
h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05}
h2.script{margin:0;font-family:var(--script);font-weight:400;font-size:34px;color:var(--gold2)}
.sec{margin:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.card{padding:18px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.card.hl{border:1px solid var(--line)}
.card.gold{background:var(--card2);border:1px solid var(--gold)}
.lbl{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.small{font-size:12px;color:var(--mute);line-height:1.5}
.mute{color:var(--mute)}
.big{font-family:var(--serif);font-weight:700;line-height:1}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{min-height:50px;border-radius:16px;border:0;background:var(--gold);color:var(--bg);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold2);font-weight:600}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(212,175,90,.45);background:transparent;color:var(--ink);font-size:13px;font-weight:600;flex-shrink:0}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:var(--chip);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);flex-shrink:0}
.note{margin:12px 20px 0;padding:12px 14px;border-radius:14px;background:#2A2440;border:1px solid rgba(212,175,90,.4);font-size:13px;line-height:1.5;color:var(--soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-height:48px;color:var(--mute);font-size:11px;font-weight:500}
nav.tabs a.on{color:var(--gold2)}
/* home */
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 24px 4px;gap:12px}
.hero img{width:min(240px,62vw);height:auto;display:block}
.tile{display:flex;flex-direction:column;gap:10px;padding:18px 16px;border-radius:18px;background:var(--card);border:1px solid rgba(212,175,90,.28);color:var(--ink)}
.tile .t{font-family:var(--serif);font-size:24px;font-weight:700}
.tile .d{font-size:13px;color:var(--mute);line-height:1.4}
.player{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px;min-width:56px}
.player .av{width:56px;height:56px;font-size:22px}
.player.me .av{background:var(--gold);color:var(--bg)}
/* lists */
.line{display:flex;gap:14px;align-items:stretch}
.line .dnum{width:46px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.line .dbody{flex:1;padding:8px 0 10px;border-bottom:1px solid rgba(159,170,196,.15);display:flex;flex-direction:column;gap:2px;white-space:pre-line}
.kv{padding:14px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.kv>span:first-child{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.kv>span:nth-child(2){font-size:16px;font-weight:600}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.wday{flex:0 0 64px;padding:12px 0;border-radius:16px;background:var(--card);border:1px solid rgba(212,175,90,.25);display:flex;flex-direction:column;align-items:center;gap:5px}
.wday.today{border-color:var(--gold);background:var(--card2)}
/* golf */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:14px;background:var(--card);margin:14px 20px 0}
.seg button{min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-size:13px;font-weight:600}
.seg button.on{background:var(--gold);color:var(--bg)}
.rank{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid transparent;overflow:hidden}
.rank.first{background:var(--card2);border-color:var(--gold)}
.rank>button{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;width:100%}
.dots{display:flex;gap:4px}
.dots span{width:18px;height:5px;border-radius:3px;background:rgba(159,170,196,.25)}
.dots span.b{background:#5B8DEF}.dots span.r{background:#E06C7A}
.rdet{padding:0 14px 14px;display:flex;flex-direction:column;font-size:12px}
.rdet .rr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;background:none;border:0;border-bottom:1px solid rgba(159,170,196,.12);padding:0;color:var(--ink);font-size:12px;min-height:40px;align-items:center}
.rdet button.rr:active{background:rgba(212,175,90,.12)}
.rdet .rr>span{padding:5px 2px;text-align:center}
.rdet .h{color:var(--mute);font-size:10px;text-transform:uppercase;min-height:28px}
.sc{width:100%;border-collapse:collapse;font-size:14px}
.sc th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:600;padding:8px 4px;border-bottom:1px solid rgba(212,175,90,.3)}
.sc td{padding:8px 4px;text-align:center;border-bottom:1px solid rgba(159,170,196,.12)}
.sc tr.sub td{background:rgba(212,175,90,.08);font-weight:700;color:var(--gold2)}
.sc tr.tot td{background:var(--card2);font-weight:700;font-size:15px;color:var(--gold2);border-bottom:0}
.sc .u{display:inline-flex;min-width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%}
.sc .u.bd{border:1.5px solid var(--gold2);color:var(--gold2)}
.sc .u.bg{border:1px solid rgba(159,170,196,.5);border-radius:6px}
.team{padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.team .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
/* budget */
.tr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card)}
.bal{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;font-size:13px;padding:7px 0}
.bal span:not(:first-child){text-align:right}
.bal.h{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;padding-bottom:8px;border-bottom:1px solid rgba(212,175,90,.2)}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sw{position:relative;border-radius:16px;overflow:hidden;background:var(--card)}
.sw .back{position:absolute;top:0;bottom:0;width:120px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;opacity:0}
.sw .back.del{right:0;color:#fff}.sw .back.edit{left:0;color:var(--bg)}
.sw .front{position:relative;padding:12px 14px;background:var(--card);display:flex;align-items:center;gap:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s ease}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ov .in{max-width:560px;margin:0 auto;padding-bottom:30px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,9,22,.75);display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{width:100%;max-width:420px;padding:24px;border-radius:22px;background:var(--card);border:1px solid var(--gold);display:flex;flex-direction:column;gap:14px}
.prog{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 20px 0}
.prog span{height:4px;border-radius:2px;background:rgba(159,170,196,.25)}
.prog span.on{background:var(--gold)}
.field{min-height:52px;border-radius:14px;border:1px solid rgba(212,175,90,.45);background:var(--bg);color:var(--ink);padding:0 14px;width:100%;color-scheme:dark}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.amt input{flex:1;min-width:0;border:0;background:transparent;color:var(--gold2);font-family:var(--serif);font-size:56px;font-weight:700;padding:0}
.amt input:focus{outline:none}
.qt{font-family:var(--serif);font-size:28px;font-weight:700}
.opt{min-height:54px;border-radius:14px;border:1px solid rgba(212,175,90,.45);background:transparent;color:var(--ink);font-size:16px;font-weight:600}
.opt.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
/* médias */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mgrid button{aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.mgrid img,.mgrid video{width:100%;height:100%;object-fit:cover;display:block}
.mgrid .play{position:absolute;left:6px;bottom:6px}
.potd{border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);position:relative;min-height:200px;display:flex;align-items:flex-end}
.potd img,.potd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.potd .cap{position:relative;width:100%;padding:16px;background:linear-gradient(transparent,rgba(4,9,22,.85))}
.lb{position:fixed;inset:0;z-index:50;background:rgba(2,6,16,.96);display:flex;flex-direction:column}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.lb .media{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--card2);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate" hidden style="position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto"></div>
<div class="app" id="app"></div>

<nav class="tabs" aria-label="Rubriques"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function () {
'use strict';
var NAMES = ['Vic', 'Nico', 'Jef', 'JC', 'Sam'];
var START = new Date(2027, 0, 22), END = new Date(2027, 0, 31);
var TEAMS = [
  ['Jef, JC, Sam', 'Vic, Nico'], ['Vic, Nico, Sam', 'Jef, JC'], ['Nico, Jef, JC', 'Vic, Sam'],
  ['Vic, JC, Sam', 'Nico, Jef'], ['Vic, Nico, Jef', 'JC, Sam'], ['Nico, JC, Sam', 'Vic, Jef']
];
var TEAM_OF = TEAMS.map(function (t) { var m = {}; t[0].split(', ').forEach(function (n) { m[n] = 'b'; }); t[1].split(', ').forEach(function (n) { m[n] = 'r'; }); return m; });
var DOWS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
var GOLF_DAYS = [24, 25, 26, 27, 28, 29];
function golfLabel(k) { var d = new Date(2027, 0, GOLF_DAYS[k]); var s = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); }

var IC = {
  home: '<path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/>',
  voyage: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  meteo: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  golf: '<path d="M8 21V3l9 4-9 4"/><ellipse cx="12" cy="21" rx="8" ry="1.5"/>',
  budget: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  medias: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  hotel: '<path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5"/>',
  chev: '<path d="m9 6 6 6-6 6"/>', back: '<path d="m15 6-6 6 6 6"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  arrow: '<path d="M4 12h15M14 7l5 5-5 5"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  up: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', cloud: '<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'
};
function ic(name, size, color, sw) {
  return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (sw || 1.7) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[name] + '</svg>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(c) { return (c / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today0() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function fmtDate(s) { var p = String(s).split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return isNaN(d) ? s : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function parseAmount(s) { var v = parseFloat(String(s || '').replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? 0 : Math.round(v * 100); }
function fnum(v) { return v == null ? '—' : esc(String(v).replace('.', ',')); }
function ini(n) { return n.slice(0, 2).toUpperCase(); }
var CONTACTS = {};
var DOSSIER = '';
var PHOTOS = { Nico: 'nico.jpg', Vic: 'vic.jpg', JC: 'jc.jpg', Jef: 'jef.jpg', Sam: 'sam.jpg' };
function avInner(n) { return PHOTOS[n] ? '<img src="' + PHOTOS[n] + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">' : esc(ini(n)); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3200); }

var S = {
  view: 'accueil', golfTab: 'rank', golfOpen: null, mediaFilter: 'all',
  me: '',
  db: null, assets: null, dbState: 'loading', readOnly: false,
  expenses: [], golf: null, voyage: null, meteo: null, medias: [],
  sheet: null, detail: false, trash: false, confirm: null, lightbox: null, expTrash: [], medTrash: []
};

/* ---------- writes ---------- */
function onWriteError(e) {
  if (e && e.code === 'invalid_argument') { S.readOnly = true; toast("Accès refusé : vérifie le code d'accès."); render(); }
  else if (e && e.code === 'quota_exceeded') toast('Espace de stockage plein.');
  else toast("L'enregistrement a échoué, réessaie dans un instant.");
}

/* ---------- views ---------- */
function header(kicker, title) {
  return '<header class="head"><a href="#accueil" aria-label="Retour à l\'accueil"><img src="logo-sm.png" alt=""></a><div><div class="kicker">' + kicker + '</div><h1>' + title + '</h1></div></header>';
}
function dbNote() {
  if (S.dbState === 'off') return '<div class="note">Les données du groupe ne sont pas joignables pour le moment. Vérifie ta connexion.</div>';
  if (S.dbState === 'slow') return '<div class="note">Les données du groupe ne sont pas encore joignables. Elles s\'afficheront dès que possible.</div>';
  if (S.readOnly) return '<div class="note">Accès refusé par le serveur : le code d\'accès a peut-être changé. Recharge la page et saisis le nouveau code.</div>';
  return '';
}

function vAccueil() {
  var d = Math.round((START - today0()) / 86400000);
  var count = '';
  if (d > 0) count = '<section class="sec"><div class="card hl" style="flex-direction:row;align-items:center;justify-content:space-between;padding:20px;border-radius:22px"><div style="display:flex;flex-direction:column;gap:4px"><span class="small" style="text-transform:uppercase;letter-spacing:2px">Départ dans</span><span id="cd-days" style="font-size:46px;line-height:1;font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums lining-nums">' + cdParts().days + ' <span style="font-size:20px;font-weight:500">' + (cdParts().days > 1 ? 'jours' : 'jour') + '</span></span><span id="cd-hms" style="font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums">' + cdParts().hms + '</span></div><div style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px"><span style="font-size:18px;font-weight:600;font-variant-numeric:lining-nums">22 → 31 janv.</span><span class="small">2027 · 9 nuits</span></div></div></section>';
  else if (d === 0) count = '<section class="sec"><div class="card gold" style="align-items:center;text-align:center;padding:26px 20px;border-radius:22px;gap:6px"><span class="big" style="font-size:76px;color:var(--gold2)">Jour J</span><span>Cap sur l\'île Maurice !</span></div></section>';
  var players = NAMES.map(function (n) {
    return '<button type="button" class="player" data-person="' + n + '" aria-label="Contacter ' + esc(CONTACTS[n] ? CONTACTS[n].nom : n) + '"><span class="av">' + avInner(n) + '</span><span style="font-size:13px">' + n + '</span></button>';

function computeBudget() {
  var paid = {}, owed = {}, total = 0;
  NAMES.forEach(function (n) { paid[n] = 0; owed[n] = 0; });
  S.expenses.forEach(function (e) {
    var shares = (e.shares || []).filter(function (n) { return NAMES.indexOf(n) >= 0; });
    if (!shares.length || NAMES.indexOf(e.payer) < 0) return;
    total += e.cents; paid[e.payer] += e.cents;
    var k = shares.length, base = Math.floor(e.cents / k), rest = e.cents - base * k;
    shares.forEach(function (n, i) { owed[n] += base + (i < rest ? 1 : 0); });
  });
  var bal = NAMES.map(function (n) { return { n: n, paid: paid[n], owed: owed[n], b: paid[n] - owed[n] }; });
  var cred = bal.filter(function (x) { return x.b > 0; }).map(function (x) { return { n: x.n, v: x.b }; }).sort(function (a, b) { return b.v - a.v; });
  var debt = bal.filter(function (x) { return x.b < 0; }).map(function (x) { return { n: x.n, v: -x.b }; }).sort(function (a, b) { return b.v - a.v; });
  var tr = [], i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    var x = Math.min(debt[i].v, cred[j].v);
    if (x > 0) tr.push({ from: debt[i].n, to: cred[j].n, c: x });
    debt[i].v -= x; cred[j].v -= x;
    if (!debt[i].v) i++; if (!cred[j].v) j++;
  }
  return { total: total, bal: bal, tr: tr };
}
