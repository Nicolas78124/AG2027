<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EVA BP Days</title>
<meta name="theme-color" content="#14161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EVA BP Days">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161C;--card:#1E2129;--ink:#F3F1EC;--mute:#A3A7B3;--accent:#E7B98A;--line:rgba(231,185,138,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom))}
.kicker{font-size:11px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-weight:600}
h1{margin:6px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;font-weight:700;line-height:1.05}
.card{margin-top:24px;padding:28px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.card p{margin:0;font-size:14px;color:var(--mute);line-height:1.5}
</style>
</head>
<body>
<main class="app">
  <div class="kicker">Bienvenue</div>
  <h1>EVA BP Days</h1>
  <div class="card"><p>Cette page est en préparation.</p></div>
</main>
</body>
</html>
